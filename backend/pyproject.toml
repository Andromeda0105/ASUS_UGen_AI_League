[project]
name = "ai-security-log-copilot"
version = "0.1.0"
description = "Local-first security log analysis prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "starlette>=0.47,<2.0",
  "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1.0"]

[tool.ruff]
line-length = 100
